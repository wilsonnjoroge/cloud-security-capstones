---
- name: Web tier hardening
  hosts: all
  become: true
  vars:
    alb_sg_cidr: "{{ web_alb_cidr }}"   # passed via ExtraVariables from the SSM association

  tasks:
    - name: Apply shared base hardening
      ansible.builtin.include_tasks: base-tasks.yml

    - name: Allow HTTP only from public ALB
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp
        src: "{{ alb_sg_cidr }}"

    - name: Allow HTTPS only from public ALB
      community.general.ufw:
        rule: allow
        port: '443'
        proto: tcp
        src: "{{ alb_sg_cidr }}"

    - name: Enable ufw
      community.general.ufw:
        state: enabled

    - name: Create non-root web service user
      ansible.builtin.user:
        name: webapp
        system: true
        shell: /usr/sbin/nologin
        create_home: false

  handlers:
    - name: Restart sshd
      ansible.builtin.systemd:
        name: sshd
        state: restarted
