<svg viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">AZ / Subnet Placement — AWS Capstone</text>
  <text x="700" y="49" text-anchor="middle" font-size="12.5" fill="#666">One subnet per tier per AZ · per-AZ NAT Gateways · DB subnets have no default route</text>

  <!-- IGW -->
  <rect x="610" y="60" width="140" height="40" rx="6" fill="#555"/>
  <text x="680" y="85" text-anchor="middle" fill="#fff" font-weight="600" font-size="13">Internet Gateway</text>
  <line x1="680" y1="100" x2="680" y2="122" stroke="#555" stroke-width="2"/>

  <!-- VPC outer -->
  <rect x="40" y="122" width="1320" height="710" rx="8" fill="#fbfbfd" stroke="#333" stroke-width="2"/>
  <text x="60" y="145" font-size="14" font-weight="700" fill="#1a1a2e">VPC — 10.0.0.0/16 (DNS support + hostnames enabled)</text>

  <!-- AZ column headers -->
  <text x="365" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#2255aa">Availability Zone A</text>
  <text x="975" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#2255aa">Availability Zone B</text>
  <line x1="365" y1="176" x2="365" y2="182" stroke="#2255aa"/>
  <line x1="80" y1="182" x2="650" y2="182" stroke="#2255aa" stroke-width="1.5"/>
  <line x1="690" y1="182" x2="1260" y2="182" stroke="#2255aa" stroke-width="1.5"/>

  <!-- Public row -->
  <rect x="80" y="192" width="1180" height="34" rx="6" fill="#c9660a"/>
  <text x="670" y="214" text-anchor="middle" fill="#fff" font-weight="600" font-size="13">Public ALB — internet-facing · SG: CloudFront prefix list only · port 80</text>

  <g font-size="12">
    <rect x="80"  y="236" width="570" height="60" fill="#fff4e2" stroke="#e8c48a"/>
    <text x="95" y="253" font-weight="700" fill="#a3650c">Public Subnet AZ-a — 10.0.0.0/24</text>
    <rect x="95" y="262" width="130" height="26" rx="4" fill="#a3650c"/>
    <text x="160" y="279" text-anchor="middle" fill="#fff" font-size="11">NAT GW + EIP</text>
    <text x="240" y="280" fill="#7a4d09" font-size="10.5">workload instances never placed here</text>

    <rect x="690" y="236" width="570" height="60" fill="#fff4e2" stroke="#e8c48a"/>
    <text x="705" y="253" font-weight="700" fill="#a3650c">Public Subnet AZ-b — 10.0.1.0/24</text>
    <rect x="705" y="262" width="130" height="26" rx="4" fill="#a3650c"/>
    <text x="770" y="279" text-anchor="middle" fill="#fff" font-size="11">NAT GW + EIP</text>
    <text x="850" y="280" fill="#7a4d09" font-size="10.5">workload instances never placed here</text>
  </g>

  <!-- Web row -->
  <rect x="80" y="306" width="1180" height="34" rx="6" fill="#1a7f4b"/>
  <text x="670" y="328" text-anchor="middle" fill="#fff" font-weight="600" font-size="13">Internal ALB — internal-only, no internet-facing network path · port 443</text>

  <g font-size="12">
    <rect x="80"  y="350" width="570" height="65" fill="#e9f9ee" stroke="#a3ddb8"/>
    <text x="95" y="367" font-weight="700" fill="#1a7f4b">Web Subnet AZ-a — 10.0.10.0/24</text>
    <rect x="95" y="376" width="220" height="30" rx="4" fill="#1a7f4b"/>
    <text x="205" y="392" text-anchor="middle" fill="#fff" font-size="10.5">Web ASG — min 1 instance/AZ</text>
    <text x="95" y="410" fill="#0e5c33" font-size="10">IMDSv2 enforced · TLS 8443 listener · egress via own-AZ NAT</text>

    <rect x="690" y="350" width="570" height="65" fill="#e9f9ee" stroke="#a3ddb8"/>
    <text x="705" y="367" font-weight="700" fill="#1a7f4b">Web Subnet AZ-b — 10.0.11.0/24</text>
    <rect x="705" y="376" width="220" height="30" rx="4" fill="#1a7f4b"/>
    <text x="815" y="392" text-anchor="middle" fill="#fff" font-size="10.5">Web ASG — min 1 instance/AZ</text>
    <text x="705" y="410" fill="#0e5c33" font-size="10">IMDSv2 enforced · TLS 8443 listener · egress via own-AZ NAT</text>
  </g>

  <!-- App row -->
  <g font-size="12">
    <rect x="80"  y="430" width="570" height="80" fill="#fdecec" stroke="#e8a9a9"/>
    <text x="95" y="450" font-weight="700" fill="#a32d2d">App Subnet AZ-a — 10.0.20.0/24</text>
    <rect x="95" y="459" width="220" height="30" rx="4" fill="#a32d2d"/>
    <text x="205" y="479" text-anchor="middle" fill="#fff" font-size="10.5">App ASG — min 1 instance/AZ</text>
    <text x="95" y="498" fill="#7a1f1f" font-size="10">Secrets: app DB cred + Redis AUTH only · TLS 8080 listener</text>

    <rect x="690" y="430" width="570" height="80" fill="#fdecec" stroke="#e8a9a9"/>
    <text x="705" y="450" font-weight="700" fill="#a32d2d">App Subnet AZ-b — 10.0.21.0/24</text>
    <rect x="705" y="459" width="220" height="30" rx="4" fill="#a32d2d"/>
    <text x="815" y="479" text-anchor="middle" fill="#fff" font-size="10.5">App ASG — min 1 instance/AZ</text>
    <text x="705" y="498" fill="#7a1f1f" font-size="10">Secrets: app DB cred + Redis AUTH only · TLS 8080 listener</text>
  </g>

  <!-- VPC Endpoints strip -->
  <rect x="80" y="522" width="1180" height="42" rx="6" fill="#eaf2ff" stroke="#a9c6f0"/>
  <text x="670" y="540" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2255aa">VPC Endpoints (ingress 443 from VPC CIDR only)</text>
  <text x="670" y="556" text-anchor="middle" font-size="10.5" fill="#2255aa">S3 (gateway, no ENI) · SSM · SSMMessages · EC2Messages · Secrets Manager · CloudWatch Logs (all interface)</text>

  <!-- DB row -->
  <g font-size="12">
    <rect x="80"  y="578" width="570" height="130" fill="#f2e9fb" stroke="#c9a9e8"/>
    <text x="95" y="598" font-weight="700" fill="#6b2fa0">DB Subnet AZ-a — 10.0.30.0/24</text>
    <rect x="95" y="608" width="230" height="28" rx="4" fill="#6b2fa0"/>
    <text x="210" y="627" text-anchor="middle" fill="#fff" font-size="10.5">RDS MySQL — primary</text>
    <rect x="95" y="644" width="230" height="28" rx="4" fill="#6b2fa0"/>
    <text x="210" y="663" text-anchor="middle" fill="#fff" font-size="10.5">ElastiCache Redis — node 1</text>
    <text x="95" y="692" fill="#4a1a70" font-size="10">publicly_accessible=false · storage + transit encrypted</text>

    <rect x="690" y="578" width="570" height="130" fill="#f2e9fb" stroke="#c9a9e8"/>
    <text x="705" y="598" font-weight="700" fill="#6b2fa0">DB Subnet AZ-b — 10.0.31.0/24</text>
    <rect x="705" y="608" width="230" height="28" rx="4" fill="#6b2fa0"/>
    <text x="820" y="627" text-anchor="middle" fill="#fff" font-size="10.5">RDS subnet group member</text>
    <rect x="705" y="644" width="230" height="28" rx="4" fill="#6b2fa0"/>
    <text x="820" y="663" text-anchor="middle" fill="#fff" font-size="10.5">ElastiCache Redis — node 2</text>
    <text x="705" y="692" fill="#4a1a70" font-size="10">db_subnet_group + cache_subnet_group span both AZs</text>
  </g>

  <!-- No route callout -->
  <rect x="80" y="718" width="1180" height="46" rx="6" fill="#fdecec" stroke="#a32d2d" stroke-width="1.5"/>
  <text x="670" y="738" text-anchor="middle" font-size="12" font-weight="700" fill="#a32d2d">⚠ DB subnet route tables contain no 0.0.0.0/0 entry of any kind</text>
  <text x="670" y="754" text-anchor="middle" font-size="10.5" fill="#7a1f1f">Enforced at the route-table layer — holds even if a security group egress rule were misconfigured</text>

  <!-- NAT per-AZ note -->
  <text x="60" y="800" font-size="11.5" fill="#555">Per-AZ NAT Gateways (not shared): Web/App subnet route tables in AZ-a route 0.0.0.0/0 to AZ-a's own NAT GW, and likewise for AZ-b —</text>
  <text x="60" y="816" font-size="11.5" fill="#555">avoids a cross-AZ dependency where one AZ's NAT Gateway failure removes egress for the other AZ's private-tier instances.</text>

  <!-- Legend -->
  <g font-size="11.5">
    <rect x="60" y="835" width="18" height="14" fill="#c9660a"/><text x="84" y="847" fill="#333">Public</text>
    <rect x="160" y="835" width="18" height="14" fill="#1a7f4b"/><text x="184" y="847" fill="#333">Web</text>
    <rect x="240" y="835" width="18" height="14" fill="#a32d2d"/><text x="264" y="847" fill="#333">App</text>
    <rect x="320" y="835" width="18" height="14" fill="#6b2fa0"/><text x="344" y="847" fill="#333">DB (isolated)</text>
    <rect x="440" y="835" width="18" height="14" fill="#2255aa"/><text x="464" y="847" fill="#333">VPC Endpoints</text>
  </g>

  <text x="700" y="880" text-anchor="middle" font-size="11" fill="#999">diagrams/az-placement.svg — companion to docs/architecture/architecture-overview.md (Network module)</text>
</svg>
