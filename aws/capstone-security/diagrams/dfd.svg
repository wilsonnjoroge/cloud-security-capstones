<svg viewBox="0 0 1400 780" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrGated" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3650c"/>
    </marker>
  </defs>

  <rect width="1400" height="780" fill="#ffffff"/>
  <text x="700" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">Data Flow Diagram — AWS Capstone</text>
  <text x="700" y="52" text-anchor="middle" font-size="12.5" fill="#666">Rectangles = external entities · Rounded = processes · Open bars = data stores · Dashed = trust boundary</text>

  <!-- Trust boundary bands (top row) -->
  <g font-size="12" font-weight="600">
    <rect x="0"   y="70" width="170" height="260" fill="#f2f2f2" stroke="#cfcfcf" stroke-dasharray="4,3"/>
    <text x="85"  y="88" text-anchor="middle" fill="#555">Public Internet</text>

    <rect x="170" y="70" width="170" height="260" fill="#eaf2ff" stroke="#a9c6f0" stroke-dasharray="4,3"/>
    <text x="255" y="88" text-anchor="middle" fill="#2255aa">AWS Edge</text>

    <rect x="340" y="70" width="160" height="260" fill="#fff4e2" stroke="#e8c48a" stroke-dasharray="4,3"/>
    <text x="420" y="88" text-anchor="middle" fill="#a3650c">Public Subnet</text>

    <rect x="500" y="70" width="330" height="260" fill="#e9f9ee" stroke="#a3ddb8" stroke-dasharray="4,3"/>
    <text x="665" y="88" text-anchor="middle" fill="#1a7f4b">Private Subnets (Web / App)</text>

    <rect x="830" y="70" width="290" height="260" fill="#fdecec" stroke="#e8a9a9" stroke-dasharray="4,3"/>
    <text x="975" y="88" text-anchor="middle" fill="#a32d2d">Isolated DB Subnet</text>

    <rect x="1120" y="70" width="270" height="260" fill="#f2e9fb" stroke="#c9a9e8" stroke-dasharray="4,3"/>
    <text x="1255" y="88" text-anchor="middle" fill="#6b2fa0">Observability</text>
  </g>

  <!-- Row 1: main flow -->
  <g font-size="12.5">
    <!-- E1 external entity -->
    <rect x="35" y="150" width="110" height="60" fill="#4a4a4a"/>
    <text x="90" y="176" text-anchor="middle" fill="#fff" font-weight="600">User</text>
    <text x="90" y="192" text-anchor="middle" fill="#ddd" font-size="10.5">(external entity)</text>

    <!-- P1 CloudFront+WAF -->
    <rect x="195" y="150" width="120" height="60" rx="25" fill="#2255aa"/>
    <text x="255" y="176" text-anchor="middle" fill="#fff" font-weight="600" font-size="12">P1: Edge</text>
    <text x="255" y="192" text-anchor="middle" fill="#dce8ff" font-size="10">Filtering (WAF)</text>

    <!-- P2 Public ALB -->
    <rect x="355" y="150" width="130" height="60" rx="25" fill="#c9660a"/>
    <text x="420" y="176" text-anchor="middle" fill="#fff" font-weight="600" font-size="12">P2: Public</text>
    <text x="420" y="192" text-anchor="middle" fill="#fde8d3" font-size="10">Routing (ALB)</text>

    <!-- P3 Web tier -->
    <rect x="520" y="150" width="120" height="60" rx="25" fill="#1a7f4b"/>
    <text x="580" y="176" text-anchor="middle" fill="#fff" font-weight="600" font-size="12">P3: Web</text>
    <text x="580" y="192" text-anchor="middle" fill="#d9f5e3" font-size="10">Presentation</text>

    <!-- P4 Internal ALB -->
    <rect x="675" y="150" width="120" height="60" rx="25" fill="#1a7f4b"/>
    <text x="735" y="176" text-anchor="middle" fill="#fff" font-weight="600" font-size="12">P4: Internal</text>
    <text x="735" y="192" text-anchor="middle" fill="#d9f5e3" font-size="10">Routing (ALB)</text>

    <!-- P5 App tier -->
    <rect x="700" y="230" width="120" height="60" rx="25" fill="#a32d2d"/>
    <text x="760" y="256" text-anchor="middle" fill="#fff" font-weight="600" font-size="12">P5: App</text>
    <text x="760" y="272" text-anchor="middle" fill="#fbdcdc" font-size="10">Business Logic</text>

    <!-- D1 RDS data store (open bar) -->
    <line x1="870" y1="150" x2="1080" y2="150" stroke="#6b2fa0" stroke-width="3"/>
    <line x1="870" y1="200" x2="1080" y2="200" stroke="#6b2fa0" stroke-width="3"/>
    <text x="975" y="172" text-anchor="middle" font-weight="600" fill="#6b2fa0" font-size="12">D1: RDS MySQL</text>
    <text x="975" y="190" text-anchor="middle" fill="#6b2fa0" font-size="10">Application data (confidential)</text>

    <!-- D2 Redis data store -->
    <line x1="870" y1="235" x2="1080" y2="235" stroke="#6b2fa0" stroke-width="3"/>
    <line x1="870" y1="285" x2="1080" y2="285" stroke="#6b2fa0" stroke-width="3"/>
    <text x="975" y="257" text-anchor="middle" font-weight="600" fill="#6b2fa0" font-size="12">D2: ElastiCache</text>
    <text x="975" y="275" text-anchor="middle" fill="#6b2fa0" font-size="10">Session / cache data</text>
  </g>

  <!-- Row 1 arrows -->
  <g font-size="10.5" fill="#333">
    <line x1="145" y1="180" x2="192" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
    <text x="168" y="168" text-anchor="middle">request (PII possible)</text>

    <line x1="315" y1="180" x2="352" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
    <text x="333" y="168" text-anchor="middle" font-size="9.5">filtered req.</text>

    <line x1="485" y1="180" x2="517" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
    <text x="500" y="168" text-anchor="middle" font-size="9.5">fwd. req.</text>

    <line x1="640" y1="180" x2="672" y2="180" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
    <text x="655" y="168" text-anchor="middle" font-size="9.5">session req.</text>

    <line x1="735" y1="210" x2="760" y2="227" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
    <text x="770" y="215" text-anchor="middle" font-size="9.5">biz. req.</text>

    <line x1="820" y1="255" x2="867" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
    <text x="850" y="220" text-anchor="middle" font-size="9.5">SQL query</text>

    <line x1="820" y1="265" x2="867" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
    <text x="845" y="290" text-anchor="middle" font-size="9.5">cache r/w</text>
  </g>

  <!-- Row 2: secrets / config / logs -->
  <g font-size="12.5">
    <!-- D3 Secrets Manager -->
    <line x1="560" y1="430" x2="740" y2="430" stroke="#a3650c" stroke-width="3"/>
    <line x1="560" y1="480" x2="740" y2="480" stroke="#a3650c" stroke-width="3"/>
    <text x="650" y="452" text-anchor="middle" font-weight="600" fill="#a3650c" font-size="12">D3: Secrets Manager</text>
    <text x="650" y="470" text-anchor="middle" fill="#a3650c" font-size="10">Credentials — IAM-gated</text>

    <!-- D4 S3 Ansible bundle -->
    <line x1="230" y1="430" x2="410" y2="430" stroke="#a3650c" stroke-width="3"/>
    <line x1="230" y1="480" x2="410" y2="480" stroke="#a3650c" stroke-width="3"/>
    <text x="320" y="452" text-anchor="middle" font-weight="600" fill="#a3650c" font-size="12">D4: S3 Ansible Bundle</text>
    <text x="320" y="470" text-anchor="middle" fill="#a3650c" font-size="10">Config — encrypted, versioned</text>

    <!-- D5 CloudWatch Logs -->
    <line x1="890" y1="430" x2="1070" y2="430" stroke="#6b2fa0" stroke-width="3"/>
    <line x1="890" y1="480" x2="1070" y2="480" stroke="#6b2fa0" stroke-width="3"/>
    <text x="980" y="452" text-anchor="middle" font-weight="600" fill="#6b2fa0" font-size="12">D5: CloudWatch Logs</text>
    <text x="980" y="470" text-anchor="middle" fill="#6b2fa0" font-size="10">Flow logs + DB audit logs</text>
  </g>

  <!-- Row 2 gated arrows (dashed = IAM-gated / read-only) -->
  <g font-size="10" fill="#a3650c">
    <line x1="760" y1="290" x2="660" y2="427" stroke="#a3650c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrGated)"/>
    <text x="740" y="360" text-anchor="middle">GetSecretValue (2 secrets only)</text>

    <line x1="580" y1="210" x2="340" y2="427" stroke="#a3650c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrGated)"/>
    <text x="430" y="330" text-anchor="middle">bundle pull (web)</text>

    <line x1="760" y1="290" x2="360" y2="427" stroke="#a3650c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrGated)"/>
    <text x="580" y="380" text-anchor="middle">bundle pull (app)</text>

    <line x1="975" y1="200" x2="980" y2="427" stroke="#6b2fa0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
    <text x="1075" y="300" text-anchor="middle" fill="#6b2fa0">RDS audit/error/</text>
    <text x="1075" y="313" text-anchor="middle" fill="#6b2fa0">slowquery logs</text>

    <line x1="735" y1="210" x2="1040" y2="427" stroke="#6b2fa0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>
    <text x="855" y="360" text-anchor="middle" fill="#6b2fa0">VPC flow logs</text>
    <text x="855" y="373" text-anchor="middle" fill="#6b2fa0">(ACCEPT+REJECT)</text>
  </g>

  <!-- Legend -->
  <g font-size="12">
    <rect x="40" y="560" width="26" height="18" fill="#4a4a4a"/>
    <text x="76" y="574" fill="#333">External entity</text>

    <rect x="220" y="560" width="26" height="18" rx="9" fill="#1a7f4b"/>
    <text x="256" y="574" fill="#333">Process</text>

    <line x1="400" y1="562" x2="426" y2="562" stroke="#6b2fa0" stroke-width="3"/>
    <line x1="400" y1="576" x2="426" y2="576" stroke="#6b2fa0" stroke-width="3"/>
    <text x="436" y="574" fill="#333">Data store</text>

    <line x1="560" y1="569" x2="600" y2="569" stroke="#333" stroke-width="2" marker-end="url(#arr)"/>
    <text x="608" y="574" fill="#333">Data flow</text>

    <line x1="720" y1="569" x2="760" y2="569" stroke="#a3650c" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrGated)"/>
    <text x="768" y="574" fill="#333">IAM-gated / read-only flow</text>
  </g>

  <rect x="40" y="600" width="1320" height="150" rx="6" fill="#fafafa" stroke="#ddd"/>
  <text x="55" y="622" font-size="12.5" font-weight="700" fill="#1a1a2e">Data classification notes</text>
  <text x="55" y="644" font-size="11" fill="#444">• User request may carry PII — no classification control exists before the WAF boundary; application owns input handling beyond generic WAF rules.</text>
  <text x="55" y="662" font-size="11" fill="#444">• P2→P3 hop (Public ALB → Web) is TLS; the earlier P1→P2 hop (CloudFront → Public ALB) is deliberately plaintext — see architecture-overview.md.</text>
  <text x="55" y="680" font-size="11" fill="#444">• RDS master credential (break-glass) is a separate secret from the app credential shown here — never referenced by P5's IAM policy in normal operation.</text>
  <text x="55" y="698" font-size="11" fill="#444">• D4 (Ansible bundle) integrity relies on S3 versioning + KMS encryption only — authenticity of executed content is not cryptographically verified (see threat-model.md).</text>
  <text x="55" y="716" font-size="11" fill="#444">• D5 aggregates both network-layer (flow logs) and data-layer (RDS query logs) telemetry — it is the one store fed from two independent trust zones.</text>
  <text x="55" y="734" font-size="11" fill="#444">• All D3/D4 access from P3/P5 traverses VPC interface/gateway endpoints, not NAT/internet — see network-security.md.</text>

  <text x="700" y="768" text-anchor="middle" font-size="11" fill="#999">diagrams/dfd.svg — companion to docs/architecture/dfd.md</text>
</svg>
