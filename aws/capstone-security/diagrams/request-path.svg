<svg viewBox="0 0 1400 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f4b"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c9660a"/>
    </marker>
  </defs>

  <rect width="1400" height="640" fill="#ffffff"/>
  <text x="700" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">Request Path — AWS Capstone</text>
  <text x="700" y="54" text-anchor="middle" font-size="13" fill="#666">Bands = trust zones. Green solid = TLS. Orange dashed = deliberate plaintext hop.</text>

  <!-- Trust zone bands -->
  <g font-size="13" font-weight="600">
    <rect x="0"    y="75" width="190" height="400" fill="#f2f2f2" stroke="#cfcfcf" stroke-dasharray="4,3"/>
    <text x="95"   y="95" text-anchor="middle" fill="#555">Public Internet</text>

    <rect x="190"  y="75" width="180" height="400" fill="#eaf2ff" stroke="#a9c6f0" stroke-dasharray="4,3"/>
    <text x="280"  y="95" text-anchor="middle" fill="#2255aa">AWS Edge (CloudFront)</text>

    <rect x="370"  y="75" width="180" height="400" fill="#fff4e2" stroke="#e8c48a" stroke-dasharray="4,3"/>
    <text x="460"  y="95" text-anchor="middle" fill="#a3650c">Public Subnet</text>

    <rect x="550"  y="75" width="360" height="400" fill="#e9f9ee" stroke="#a3ddb8" stroke-dasharray="4,3"/>
    <text x="730"  y="95" text-anchor="middle" fill="#1a7f4b">Web Subnet (Private)</text>

    <rect x="910"  y="75" width="180" height="400" fill="#fdecec" stroke="#e8a9a9" stroke-dasharray="4,3"/>
    <text x="1000" y="95" text-anchor="middle" fill="#a32d2d">App Subnet (Private)</text>

    <rect x="1090" y="75" width="310" height="400" fill="#f2e9fb" stroke="#c9a9e8" stroke-dasharray="4,3"/>
    <text x="1245" y="95" text-anchor="middle" fill="#6b2fa0">DB Subnet (Isolated — no internet route)</text>
  </g>

  <!-- Nodes -->
  <g font-size="13">
    <!-- Client -->
    <rect x="35"  y="245" width="120" height="70" rx="8" fill="#4a4a4a"/>
    <text x="95" y="275" text-anchor="middle" fill="#fff" font-weight="600">Client</text>
    <text x="95" y="293" text-anchor="middle" fill="#e0e0e0" font-size="11">Browser</text>

    <!-- CloudFront -->
    <rect x="210" y="245" width="140" height="70" rx="8" fill="#2255aa"/>
    <text x="280" y="275" text-anchor="middle" fill="#fff" font-weight="600">CloudFront</text>
    <text x="280" y="293" text-anchor="middle" fill="#dce8ff" font-size="11">+ WAF Web ACL</text>

    <!-- Public ALB -->
    <rect x="390" y="245" width="140" height="70" rx="8" fill="#c9660a"/>
    <text x="460" y="271" text-anchor="middle" fill="#fff" font-weight="600">Public ALB</text>
    <text x="460" y="288" text-anchor="middle" fill="#fde8d3" font-size="10.5">internet-facing</text>
    <text x="460" y="302" text-anchor="middle" fill="#fde8d3" font-size="10.5">SG: CF prefix list only</text>

    <!-- Web ASG -->
    <rect x="565" y="190" width="140" height="70" rx="8" fill="#1a7f4b"/>
    <text x="635" y="220" text-anchor="middle" fill="#fff" font-weight="600">Web Tier</text>
    <text x="635" y="238" text-anchor="middle" fill="#d9f5e3" font-size="10.5">ASG, min 2 (1/AZ)</text>
    <text x="635" y="252" text-anchor="middle" fill="#d9f5e3" font-size="10.5">IMDSv2 enforced</text>

    <!-- Internal ALB -->
    <rect x="765" y="330" width="140" height="70" rx="8" fill="#1a7f4b"/>
    <text x="835" y="356" text-anchor="middle" fill="#fff" font-weight="600">Internal ALB</text>
    <text x="835" y="373" text-anchor="middle" fill="#d9f5e3" font-size="10.5">internal-only</text>
    <text x="835" y="387" text-anchor="middle" fill="#d9f5e3" font-size="10.5">no internet path</text>

    <!-- App ASG -->
    <rect x="935" y="245" width="140" height="70" rx="8" fill="#a32d2d"/>
    <text x="1005" y="271" text-anchor="middle" fill="#fff" font-weight="600">App Tier</text>
    <text x="1005" y="288" text-anchor="middle" fill="#fbdcdc" font-size="10.5">ASG, min 2 (1/AZ)</text>
    <text x="1005" y="302" text-anchor="middle" fill="#fbdcdc" font-size="10.5">Secrets: 2 scoped only</text>

    <!-- RDS -->
    <rect x="1160" y="150" width="150" height="65" rx="8" fill="#6b2fa0"/>
    <text x="1235" y="176" text-anchor="middle" fill="#fff" font-weight="600">RDS MySQL</text>
    <text x="1235" y="192" text-anchor="middle" fill="#ecdcf7" font-size="10.5">publicly_accessible=false</text>
    <text x="1235" y="205" text-anchor="middle" fill="#ecdcf7" font-size="10.5">require_secure_transport</text>

    <!-- Redis -->
    <rect x="1160" y="360" width="150" height="65" rx="8" fill="#6b2fa0"/>
    <text x="1235" y="386" text-anchor="middle" fill="#fff" font-weight="600">ElastiCache Redis</text>
    <text x="1235" y="403" text-anchor="middle" fill="#ecdcf7" font-size="10.5">transit enc. + AUTH</text>
  </g>

  <!-- Arrows -->
  <g font-size="11.5" font-weight="600">
    <line x1="155" y1="280" x2="207" y2="280" stroke="#1a7f4b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="181" y="230" text-anchor="middle" fill="#1a7f4b" font-size="11">HTTPS</text>
    <text x="181" y="243" text-anchor="middle" fill="#1a7f4b" font-size="11">443</text>

    <line x1="350" y1="280" x2="387" y2="280" stroke="#c9660a" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>
    <text x="368" y="230" text-anchor="middle" fill="#c9660a" font-size="11">HTTP</text>
    <text x="368" y="243" text-anchor="middle" fill="#c9660a" font-size="11">80</text>

    <line x1="530" y1="270" x2="562" y2="235" stroke="#1a7f4b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="512" y="240" text-anchor="middle" fill="#1a7f4b">TLS 8443</text>

    <line x1="705" y1="245" x2="762" y2="345" stroke="#1a7f4b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="770" y="300" text-anchor="middle" fill="#1a7f4b">TLS 443</text>

    <line x1="905" y1="350" x2="932" y2="290" stroke="#1a7f4b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="945" y="330" text-anchor="middle" fill="#1a7f4b">TLS 8080</text>

    <line x1="1075" y1="255" x2="1157" y2="200" stroke="#1a7f4b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="1097" y="216" text-anchor="middle" fill="#1a7f4b">TLS 3306</text>

    <line x1="1075" y1="300" x2="1157" y2="365" stroke="#1a7f4b" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
    <text x="1097" y="345" text-anchor="middle" fill="#1a7f4b">TLS 6379</text>
  </g>

  <!-- Callout -->
  <rect x="230" y="490" width="290" height="70" rx="6" fill="#fff8ec" stroke="#c9660a" stroke-width="1.5"/>
  <text x="245" y="510" font-size="11.5" font-weight="700" fill="#a3650c">Accepted capstone limitation</text>
  <text x="245" y="526" font-size="10.5" fill="#5a4530">CloudFront rejects self-signed &amp; Private CA</text>
  <text x="245" y="540" font-size="10.5" fill="#5a4530">origin certs. No owned domain = no ACM cert.</text>
  <text x="245" y="554" font-size="10.5" fill="#5a4530">See architecture-overview.md for remediation.</text>
  <line x1="375" y1="490" x2="368" y2="320" stroke="#c9660a" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Legend -->
  <g font-size="12">
    <line x1="900" y1="510" x2="940" y2="510" stroke="#1a7f4b" stroke-width="2.5"/>
    <text x="948" y="514" fill="#333">TLS encrypted hop</text>
    <line x1="900" y1="535" x2="940" y2="535" stroke="#c9660a" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="948" y="539" fill="#333">Plaintext (deliberate, documented)</text>
  </g>

  <text x="700" y="620" text-anchor="middle" font-size="11" fill="#999">diagrams/request-path.svg — companion to docs/architecture/architecture-overview.md</text>
</svg>
